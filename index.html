<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List — Week 7</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>My To-Do List</h1>

      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit">Add</button>
      </form>

      <div class="filters">
        <button type="button" class="filter active" data-filter="all">
          All
        </button>
        <button type="button" class="filter" data-filter="active">
          Active
        </button>
        <button type="button" class="filter" data-filter="completed">
          Completed
        </button>
      </div>

      <ul id="todo-list"></ul>

      <div class="stats">
        <span id="items-left">0 items left</span>
        <button type="button" id="clear-completed">Clear Completed</button>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
