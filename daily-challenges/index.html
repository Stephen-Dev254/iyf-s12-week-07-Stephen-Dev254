<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 13.1 — Persistent Notes App</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      input,
      textarea,
      button {
        padding: 0.6rem;
        font-size: 1rem;
      }
      .note-card {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .delete-btn {
        background: #e11d48;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>My Persistent Notes</h1>
    <form id="note-form">
      <input type="text" id="note-title" placeholder="Note title" required />
      <textarea
        id="note-body"
        rows="3"
        placeholder="Write your note..."
        required
      ></textarea>
      <button type="submit">Save Note</button>
    </form>

    <div id="notes-list"></div>

    <script type="module" src="notes.js"></script>
  </body>
</html>
