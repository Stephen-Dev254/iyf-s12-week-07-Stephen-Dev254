<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Storage Auto-Save Form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 500px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      input,
      textarea,
      button {
        padding: 0.6rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Contact Form (Auto-Saves to sessionStorage)</h1>
    <p>Type below and refresh the tab—your draft stays until you submit or close the tab.</p>

    <form id="contact-form">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <script src="session-form.js"></script>
  </body>
</html>
