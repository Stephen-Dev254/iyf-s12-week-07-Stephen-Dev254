<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Day 3 — Form Auto-Save (Every 5s)</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 500px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            form {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            input,
            textarea,
            button {
                padding: 0.6rem;
                font-size: 1rem;
            }
            small {
                color: #475569;
            }
        </style>
    </head>
    <body>
        <h1>Day 3: Form Auto-Save</h1>
        <small id="autosave-status">Auto-saves every 5 seconds...</small>
        <form id="autosave-form">
            <input type="text" name="fullName" placeholder="Full Name" required />
            <input type="email" name="email" placeholder="Email Address" required />
            <textarea name="notes" rows="4" placeholder="Project notes..." required></textarea>
            <button type="submit">Submit & Clear Saved Draft</button>
        </form>
        <script type="module" src="autosave.js"></script>
    </body>
</html>
